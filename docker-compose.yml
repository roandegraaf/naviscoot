services:
  graph:
    build:
      context: ./routing/graph-fetch
    environment:
      GRAPH_BASE_URL: ${GRAPH_BASE_URL:?set GRAPH_BASE_URL}
    volumes:
      - naviscoot-graph:/repo/routing/build
    restart: "no"
    exclude_from_hc: true

  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.1
    command: ["valhalla_service", "/repo/routing/build/nl/valhalla.json", "2"]
    volumes:
      - naviscoot-graph:/repo/routing/build:ro
    mem_limit: 2g
    depends_on:
      graph:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      API_KEY: ${API_KEY:?set API_KEY}
      VALHALLA_URL: http://valhalla:8002
      FUSED_ACCESS_CSV: /repo/routing/build/nl/fused_access.csv
      REPORTS_PATH: /reports/reports.jsonl
    volumes:
      - naviscoot-graph:/repo/routing/build:ro
      - naviscoot-reports:/reports
    depends_on:
      graph:
        condition: service_completed_successfully
      valhalla:
        condition: service_started
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  naviscoot-graph:
  naviscoot-reports:
