[project]
name = "naviscoot-data"
version = "0.1.0"
description = "Bromfiets access data pipeline for Naviscoot"
requires-python = ">=3.13"
dependencies = [
    "osmium>=4.3.2",
    "requests>=2.34.2",
]

[project.scripts]
fetch = "naviscoot_data.fetch:main"
audit = "naviscoot_data.audit:main"
rewrite = "naviscoot_data.rewrite:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = [
    "docker: builds and serves small Valhalla graphs in Docker (run with -m docker)",
    "valhalla: needs the local NL Valhalla from routing/serve.sh (run with -m valhalla)",
]
addopts = "-m 'not docker and not valhalla'"
